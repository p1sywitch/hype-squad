<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G S C PROJECT HYPE SQUAD BADGE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: rgba(20, 20, 30, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e8f0;
    --muted: #8888a0;
    --bravery: #9c84ec;
    --brilliance: #45ddc0;
    --balance: #f47b67;
    --discord: #5865f2;
  }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 20% 20%, rgba(156, 132, 236, 0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(69, 221, 192, 0.12), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(244, 123, 103, 0.08), transparent 50%);
    animation: bgFloat 20s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-5%, -5%) rotate(5deg); }
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 35px 35px 30px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .container::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, var(--bravery), var(--brilliance), var(--balance));
    border-radius: 2px;
    filter: blur(0.5px);
  }

  .byline {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .byline span {
    background: linear-gradient(90deg, var(--bravery), var(--brilliance));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    text-align: center;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #ffffff, #b0b0d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    line-height: 1.2;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.5;
    margin-bottom: 28px;
    padding: 0 10px;
  }

  .input-group {
    margin-bottom: 26px;
    position: relative;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input[type="password"] {
    width: 100%;
    padding: 16px 18px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Consolas', monospace;
    outline: none;
    transition: all 0.25s ease;
  }
  input[type="password"]:focus {
    border-color: var(--discord);
    background: rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.15);
  }
  input[type="password"]::placeholder {
    color: #555570;
  }

  .houses-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .house-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 26px;
  }

  .house-card {
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px 8px 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .house-card::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .house-card.bravery::before {
    background: radial-gradient(circle at 50% 0%, rgba(156, 132, 236, 0.3), transparent 70%);
  }
  .house-card.brilliance::before {
    background: radial-gradient(circle at 50% 0%, rgba(69, 221, 192, 0.3), transparent 70%);
  }
  .house-card.balance::before {
    background: radial-gradient(circle at 50% 0%, rgba(244, 123, 103, 0.3), transparent 70%);
  }

  .house-card:hover {
    transform: translateY(-4px);
    background: rgba(0, 0, 0, 0.5);
  }
  .house-card:hover::before { opacity: 1; }

  .house-card.selected {
    transform: translateY(-4px);
  }
  .house-card.bravery.selected {
    border-color: var(--bravery);
    box-shadow: 0 0 30px rgba(156, 132, 236, 0.4), inset 0 0 20px rgba(156, 132, 236, 0.1);
  }
  .house-card.brilliance.selected {
    border-color: var(--brilliance);
    box-shadow: 0 0 30px rgba(69, 221, 192, 0.4), inset 0 0 20px rgba(69, 221, 192, 0.1);
  }
  .house-card.balance.selected {
    border-color: var(--balance);
    box-shadow: 0 0 30px rgba(244, 123, 103, 0.4), inset 0 0 20px rgba(244, 123, 103, 0.1);
  }

  .house-icon {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
  }
  .house-card:hover .house-icon {
    transform: scale(1.1) rotate(-3deg);
  }
  .house-card.selected .house-icon {
    transform: scale(1.15);
  }

  .house-icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
  }

  .house-name {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text);
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--discord), #4752c4);
    color: #fff;
    box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
    margin-bottom: 10px;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(88, 101, 242, 0.6);
  }
  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-danger {
    background: rgba(218, 55, 60, 0.15);
    color: #ff6b6b;
    border: 1px solid rgba(218, 55, 60, 0.3);
  }
  .btn-danger:hover {
    background: rgba(218, 55, 60, 0.25);
    border-color: rgba(218, 55, 60, 0.6);
    transform: translateY(-2px);
  }

  .log {
    margin-top: 20px;
    padding: 0 16px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: 'Consolas', monospace;
    font-size: 0.78rem;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
    opacity: 0;
  }
  .log.show {
    max-height: 200px;
    padding: 16px;
    overflow-y: auto;
    opacity: 1;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .log::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
  }
  .log p {
    margin: 6px 0;
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .log p::before {
    content: "›";
    color: var(--muted);
    flex-shrink: 0;
  }
  .log .success { color: #45ddc0; }
  .log .error { color: #ff6b6b; }
  .log .info { color: #9c84ec; }

  .btn.loading {
    pointer-events: none;
    opacity: 0.7;
    color: transparent;
  }
  .btn.loading::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ALT DISCORD LİNKİ - LOGOLU */
  .discord-footer {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }

  .discord-link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px 10px 10px;
    background: rgba(88, 101, 242, 0.12);
    border: 1px solid rgba(88, 101, 242, 0.3);
    border-radius: 999px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .discord-link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(88, 101, 242, 0.05));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .discord-link:hover {
    transform: translateY(-3px);
    border-color: var(--discord);
    box-shadow: 0 8px 30px rgba(88, 101, 242, 0.4);
  }
  .discord-link:hover::before {
    opacity: 1;
  }

  .discord-logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--discord);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
    box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
  }

  .discord-link:hover .discord-logo {
    transform: scale(1.1) rotate(-5deg);
  }

  .discord-logo svg {
    width: 22px;
    height: 22px;
  }

  .discord-link span {
    position: relative;
    z-index: 1;
  }

  @media (max-width: 480px) {
    .container { padding: 28px 20px 24px; border-radius: 20px; }
    h1 { font-size: 1.2rem; letter-spacing: 0.5px; }
    .house-icon { width: 44px; height: 44px; }
    .house-name { font-size: 0.65rem; }
    .discord-link { font-size: 0.8rem; padding: 8px 18px 8px 8px; gap: 10px; }
    .discord-logo { width: 30px; height: 30px; }
    .discord-logo svg { width: 18px; height: 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="byline">by <span>grego</span></div>

  <h1>G S C PROJECT<br>HYPE SQUAD BADGE</h1>
  <p class="subtitle">Token'ını gir, evini seç ve rozetini al. Discord artık resmi olarak izin vermediği için bu araç API'yi doğrudan kullanır.</p>

  <div class="input-group">
    <label for="tokenInput">Discord Token</label>
    <input type="password" id="tokenInput" placeholder="Token'ını buraya yapıştır..." autocomplete="off">
  </div>

  <label class="houses-label">Ev Seçimi</label>
  <div class="house-grid" id="houseGrid">

    <div class="house-card bravery" data-house="1">
      <div class="house-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 5 5 L 95 5 L 95 55 Q 95 85 50 97 Q 5 85 5 55 Z" fill="#9c84ec"/>
          <path d="M 15 30 L 45 48 L 50 42 L 55 48 L 85 30 L 75 50 L 82 50 L 50 72 L 18 50 L 25 50 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="house-name">Bravery</div>
    </div>

    <div class="house-card brilliance" data-house="2">
      <div class="house-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 50 2 L 98 50 L 50 98 L 2 50 Z" fill="#45ddc0"/>
          <path d="M 25 35 L 47 50 L 50 46 L 53 50 L 75 35 L 68 52 L 74 52 L 50 70 L 26 52 L 32 52 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="house-name">Brilliance</div>
    </div>

    <div class="house-card balance" data-house="3">
      <div class="house-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#f47b67"/>
          <path d="M 25 35 L 47 50 L 50 46 L 53 50 L 75 35 L 68 52 L 74 52 L 50 70 L 26 52 L 32 52 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="house-name">Balance</div>
    </div>

  </div>

  <button class="btn btn-primary" id="applyBtn">Rozeti Al</button>
  <button class="btn btn-danger" id="removeBtn">Rozeti Sil</button>

  <div class="log" id="logArea"></div>

  <!-- DISCORD LİNKİ - LOGOLU -->
  <div class="discord-footer">
    <a class="discord-link" href="https://discord.gg/VqDY383A3" target="_blank">
      <span class="discord-logo">
        <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ffffff" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
      </span>
      <span>discord.gg/VqDY383A3</span>
    </a>
  </div>

</div>

<script>
  const tokenInput = document.getElementById('tokenInput');
  const houseGrid = document.getElementById('houseGrid');
  const applyBtn = document.getElementById('applyBtn');
  const removeBtn = document.getElementById('removeBtn');
  const logArea = document.getElementById('logArea');

  let selectedHouse = null;

  houseGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.house-card');
    if (!card) return;
    document.querySelectorAll('.house-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedHouse = card.dataset.house;
  });

  function showLog(message, type = 'info') {
    logArea.classList.add('show');
    const p = document.createElement('p');
    p.textContent = message;
    p.className = type;
    logArea.appendChild(p);
    logArea.scrollTop = logArea.scrollHeight;
  }

  function clearLog() {
    logArea.innerHTML = '';
  }

  async function sendRequest(houseId, btn) {
    const token = tokenInput.value.trim();
    if (!token) {
      showLog('Lütfen token gir!', 'error');
      return;
    }
    if (houseId !== null && !selectedHouse) {
      showLog('Lütfen bir ev seç!', 'error');
      return;
    }

    clearLog();
    btn.classList.add('loading');

    const body = houseId
      ? JSON.stringify({ house_id: parseInt(houseId) })
      : JSON.stringify({ house_id: null });

    try {
      const response = await fetch('https://discord.com/api/v9/hypesquad/online', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token
        },
        body: body
      });

      if (response.status === 204) {
        if (houseId) {
          showLog(`Başarılı! HypeSquad rozetin güncellendi (House ID: ${houseId}).`, 'success');
          showLog('Profilini yenileyerek kontrol edebilirsin.', 'info');
        } else {
          showLog('Başarılı! HypeSquad rozetin kaldırıldı.', 'success');
        }
      } else if (response.status === 401) {
        showLog('Hata: Token geçersiz veya süresi dolmuş!', 'error');
      } else if (response.status === 429) {
        showLog('Hata: Çok fazla istek attın (Rate Limit). Biraz bekleyip tekrar dene.', 'error');
      } else {
        const errorData = await response.text();
        showLog(`Hata: ${response.status} - ${errorData}`, 'error');
      }
    } catch (error) {
      showLog(`Bağlantı Hatası: ${error.message}`, 'error');
    } finally {
      btn.classList.remove('loading');
    }
  }

  applyBtn.addEventListener('click', () => {
    if (!selectedHouse) {
      showLog('Lütfen önce bir ev seç!', 'error');
      return;
    }
    sendRequest(selectedHouse, applyBtn);
  });

  removeBtn.addEventListener('click', () => {
    sendRequest(null, removeBtn);
  });
</script>

</body>
</html>
